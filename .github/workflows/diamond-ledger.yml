name: Diamond Ledger (scoring)

# Grades past slates against ESPN's public scores feed. Fully deterministic,
# no LLM/API key involved. Each day's slate itself is generated separately by
# the live "Diamond Ledger" scheduled Routines (NFL, CFB, MLB, Basketball),
# which do their own research in claude.ai and mirror the result straight
# into data/<collection>/<date>.json with their own commit — this workflow
# never generates picks for those sports, only grades what's already there.
#
# "NBA Stats" and "NFL Stats" are deterministic, backtested models (scripts/
# nba_stats_signals.py, scripts/nfl_stats_signals.py) patched onto the day's
# slate before grading -- they build the slate from ESPN themselves when no
# Routine has written one, so they need nothing outside this repo.
#
# Built to keep running unattended:
# - It runs every hour. GitHub starts scheduled runs late (often hours) and
#   sometimes skips them, and every run is idempotent, so frequent runs are
#   the redundancy. Minute :17 avoids the top-of-the-hour queue.
# - Each step can fail without stopping the others; whatever succeeded is
#   still committed, then the run is marked failed so it shows in Actions.
# - data/health.json records each step's status for the pick sheet and the
#   Health check workflow (which re-runs this one if it stalls).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sports:
        description: "Space-separated sport keys to score (default: nfl cfb mlb nba ncaab soccer epl)"
        required: false
        default: "nfl cfb mlb nba ncaab soccer epl"

permissions:
  contents: write

# Never two runs at once (they'd race on the same files and on the push);
# a run that starts while one is going waits for it.
concurrency:
  group: diamond-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            pip install -r requirements.txt && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Apply hand-entered data (data/manual/) to slates and scores
        id: manual
        continue-on-error: true
        run: python scripts/apply_manual.py

      - name: Put each game's over/under line on today's and tomorrow's slates (for your O/U picks)
        id: ouLines
        continue-on-error: true
        run: python scripts/slate_totals.py

      - name: Save Action Network's NBA board (betting splits) for the Basketball Routine
        id: market
        continue-on-error: true
        run: python scripts/archive_market.py

      - name: Save Sports Reference's NCAAB ratings (PD/g, adjusted efficiency) for the Basketball Routine
        id: ncaabratings
        continue-on-error: true
        run: python scripts/archive_ncaab_ratings.py

      - name: Patch today's NBA Stats picks onto the NBA slate
        id: nba
        continue-on-error: true
        run: python scripts/nba_stats_signals.py

      - name: Patch today's NBA Totals picks onto the NBA slate
        id: nbatotals
        continue-on-error: true
        run: python scripts/nba_totals_signals.py

      - name: NBA storylines on today's slate (context only)
        continue-on-error: true
        run: python scripts/nba_storylines.py

      - name: Patch today's NFL Stats picks onto the NFL slate
        id: nfl
        continue-on-error: true
        run: python scripts/nfl_stats_signals.py

      - name: NFL storylines on today's slate (context only)
        continue-on-error: true
        run: python scripts/nfl_storylines.py

      - name: CFB storylines on today's slate (context only)
        continue-on-error: true
        run: python scripts/cfb_storylines.py

      - name: Soccer storylines on today's slate (context only)
        continue-on-error: true
        run: python scripts/soccer_storylines.py

      - name: MLB storylines on today's slate (context only)
        continue-on-error: true
        run: python scripts/mlb_storylines.py

      - name: Build today's NCAA basketball slate from ESPN if no Routine has
        id: ncaab
        continue-on-error: true
        run: python scripts/auto_slate.py ncaab

      - name: Patch today's NCAAB Stats picks onto the NCAA basketball slate
        id: ncaabstats
        continue-on-error: true
        run: python scripts/ncaab_stats_signals.py

      - name: Fetch scores and grade past slates
        id: score
        continue-on-error: true
        run: python scripts/run.py ${{ github.event.inputs.sports || 'nfl cfb mlb nba ncaab soccer epl' }}

      - name: Grade storylines on finished games (live records)
        continue-on-error: true
        run: python scripts/storyline_records.py

      - name: Archive finished NBA, NFL and NCAAB games' opening and closing lines
        id: lines
        continue-on-error: true
        run: python scripts/archive_lines.py nba nfl ncaab

      - name: Record run health
        if: always()
        run: >
          python scripts/health.py
          manual=${{ steps.manual.outcome }}
          nbaStats=${{ steps.nba.outcome }} nbaTotals=${{ steps.nbatotals.outcome }} nflStats=${{ steps.nfl.outcome }} ncaabSlate=${{ steps.ncaab.outcome }} ncaabStats=${{ steps.ncaabstats.outcome }} ncaabRatings=${{ steps.ncaabratings.outcome }}
          scoring=${{ steps.score.outcome }} lines=${{ steps.lines.outcome }}

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "diamond-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Diamond Ledger: score past slates $(date -u +%F)"
          # Routines and pick intake push to main too: rebase and retry.
          # A plain rebase first. If it conflicts (the scoring and game-time runs
          # both rewrite today's NBA slate and market file), rebase again keeping
          # this run's version of the conflicting lines, and only push if every
          # JSON file this commit touches still parses.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main; then
              if git diff --name-only HEAD~1 HEAD -- '*.json' | xargs -r python -c "import json,sys; [json.load(open(f, encoding='utf-8')) for f in sys.argv[1:]]"; then
                git push origin HEAD:main && exit 0
              else
                echo "::warning::A merged JSON file did not parse; not pushing this attempt."
              fi
            fi
            git rebase --abort 2>/dev/null || true  # still stuck: the next hourly run redoes it from scratch
            sleep $((i * 10))
          done
          exit 1

      - name: Mark the run failed if any step failed
        if: steps.manual.outcome == 'failure' || steps.nba.outcome == 'failure' || steps.nbatotals.outcome == 'failure' || steps.nfl.outcome == 'failure' || steps.ncaab.outcome == 'failure' || steps.ncaabstats.outcome == 'failure' || steps.ncaabratings.outcome == 'failure' || steps.score.outcome == 'failure' || steps.lines.outcome == 'failure'
        run: |
          echo "::error::A step failed: manual data=${{ steps.manual.outcome }}, NBA Stats=${{ steps.nba.outcome }}, NBA Totals=${{ steps.nbatotals.outcome }}, NFL Stats=${{ steps.nfl.outcome }}, NCAAB slate=${{ steps.ncaab.outcome }}, NCAAB Stats=${{ steps.ncaabstats.outcome }}, NCAAB ratings=${{ steps.ncaabratings.outcome }}, scoring=${{ steps.score.outcome }}, lines=${{ steps.lines.outcome }}"
          exit 1
