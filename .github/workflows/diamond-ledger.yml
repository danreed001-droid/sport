name: Diamond Ledger (scoring)

# Grades past slates against ESPN's public scores feed. Fully deterministic,
# no LLM/API key involved. Each day's slate itself is generated separately by
# the live "Diamond Ledger" scheduled Routines (NFL, CFB, MLB, Basketball),
# which do their own research in claude.ai and mirror the result straight
# into data/<collection>/<date>.json with their own commit — this workflow
# never generates picks, only grades what's already there.

on:
  schedule:
    - cron: "0 13 * * *"  # ~9am ET (13:00 UTC; adjust +/-1h across DST if it matters to you)
  workflow_dispatch:
    inputs:
      sports:
        description: "Space-separated sport keys to score (default: nfl cfb mlb nba ncaab epl)"
        required: false
        default: "nfl cfb mlb nba ncaab epl"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch scores and grade past slates
        run: python scripts/run.py ${{ github.event.inputs.sports || 'nfl cfb mlb nba ncaab epl' }}

      - name: Commit and push results
        run: |
          git config user.name "diamond-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Diamond Ledger: score past slates $(date -u +%F)"
            git push
          fi
