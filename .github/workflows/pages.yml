name: Pick sheet (GitHub Pages)

# Rebuilds and deploys the pick sheet from main whenever main changes,
# and after the scoring or pick-intake workflows finish (their bot commits
# don't trigger push events on their own).
#
# It also publishes the built data.json to the `site-data` branch, so a
# Routine that can read raw.githubusercontent.com but not the Pages site can
# fetch https://raw.githubusercontent.com/<owner>/<repo>/site-data/data.json.
# That branch holds one commit (data.json only), replaced on every deploy.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Diamond Ledger (scoring)", "Pick intake", "NBA game-time picks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # push data.json to the site-data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build site
        run: python scripts/build_site.py --out _site

      - name: Check the pages' JavaScript (a syntax error would blank the site)
        run: python scripts/check_site_js.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish data.json to the site-data branch
        run: |
          rev=$(git rev-parse --short HEAD)
          mkdir _data && cp _site/data.json _data/
          cd _data
          git init -q -b site-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -q -m "Pick sheet data from main@$rev"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-data
