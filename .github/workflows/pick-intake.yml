name: Pick intake

# The Pages pick sheet's Submit button opens a "picks YYYY-MM-DD" issue.
# This commits those picks into data/mypicks/<date>.json, replies on the
# issue, and closes it. Only the repo owner's issues are processed: the repo
# is public, so anyone else's issue is ignored.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pick-intake
  cancel-in-progress: false

jobs:
  intake:
    if: startsWith(github.event.issue.title, 'picks ') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge picks into data/mypicks
        id: intake
        run: python scripts/intake_picks.py --summary "$RUNNER_TEMP/summary.md"

      - name: Commit and push
        if: steps.intake.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "diamond-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mypicks/
          git commit -m "My picks from issue #${ISSUE_NUMBER}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ] || [ ! -f "$RUNNER_TEMP/summary.md" ]; then
            echo "These picks were **not** saved — something failed in the Actions run. Open the run log for details, then submit again from the pick sheet." > "$RUNNER_TEMP/summary.md"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md"
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
